<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}
input {
    width:80%;
    padding:15px;
    border-radius:10px;
    margin:20px 0;
}
button {
    width:80%;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
}
.paypal {background:#0070ba;color:white;}
.cashapp {background:#00d632;color:black;}
.apple {background:#e5e5e5;color:black;}
</style>
</head>

<body>

<h2>Phoenix Exchange</h2>

<input id="amount" placeholder="Enter amount $" type="number">

<button class="paypal" onclick="send('PAYPAL')">PayPal</button>
<button class="cashapp" onclick="send('CASHAPP')">CashApp</button>
<button class="apple" onclick="send('APPLE CASH')">Apple Cash</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

function send(method){
    let amount = document.getElementById("amount").value;

    if(!amount || amount <= 0){
        alert("Enter amount");
        return;
    }

    tg.sendData(JSON.stringify({
        method: method,
        amount: amount
    }));
}
</script>

</body>
</html>
