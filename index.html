<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    background:#f5f5f5;
    font-family:Arial;
    margin:0;
    padding:20px;
}

.container {
    max-width:500px;
    margin:auto;
}

h1 {
    text-align:center;
    margin-bottom:5px;
}

p {
    text-align:center;
    color:gray;
    margin-bottom:20px;
}

.card {
    background:white;
    padding:20px;
    border-radius:20px;
}

.methods {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.btn {
    padding:18px;
    border-radius:15px;
    border:2px solid #ddd;
    font-size:16px;
    background:white;
}

.btn.active {
    background:#1976d2;
    color:white;
    border:none;
}

.big-btn {
    width:100%;
    padding:18px;
    margin-top:10px;
    border-radius:15px;
    font-size:16px;
    background:#1976d2;
    color:white;
    border:none;
}

input {
    width:100%;
    padding:18px;
    margin-top:15px;
    border-radius:15px;
    border:2px solid #ddd;
    font-size:18px;
}

.result {
    margin-top:20px;
    padding:15px;
    border-radius:15px;
    background:#e8f5e9;
    font-size:16px;
}
</style>
</head>

<body>

<div class="container">

<h1>💱 Ondawave Exchanger</h1>
<p>Рассчитайте комиссию</p>

<div class="card">

<h3>Метод оплаты</h3>

<div class="methods">
    <button class="btn active" onclick="setMethod(this,'CashApp')">CashApp</button>
    <button class="btn" onclick="setMethod(this,'PayPal')">PayPal</button>
    <button class="btn" onclick="setMethod(this,'Apple Cash')">Apple Cash</button>
    <button class="btn" onclick="setMethod(this,'Venmo')">Venmo</button>
    <button class="btn" onclick="setMethod(this,'Zelle')">Zelle</button>
    <button class="btn" onclick="setMethod(this,'PayPal Invoices')">PayPal Invoices</button>
</div>

<button class="big-btn" onclick="subscriptionMode()">
💳 Оплата зарубежных подписок онлайн сервисов
</button>

<h3>Введите сумму ($)</h3>

<input id="amount" type="number" placeholder="0.00">

<button class="big-btn" onclick="calculate()">
Рассчитать чистую сумму
</button>

<div id="result" class="result" style="display:none;"></div>

</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let method = "CashApp";
let usdRate = 92;
let subscription = false;

async function getRate(){
    try{
        let res = await fetch("https://www.cbr-xml-daily.ru/daily_json.js");
        let data = await res.json();
        usdRate = data.Valute.USD.Value;
    }catch(e){}
}

getRate();

function setMethod(btn, m){
    document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    method = m;
    subscription = false;
}

function subscriptionMode(){
    subscription = true;
    alert("Формула: Цена подписки + $5");
}

function calculate(){
    let amount = document.getElementById("amount").value;

    if(!amount || amount <= 0){
        alert("Введите сумму");
        return;
    }

    let finalAmount;

    if(subscription){
        finalAmount = parseFloat(amount) + 5;
    } else {
        let commission = amount * 0.15;
        finalAmount = amount - commission;
    }

    let rub = finalAmount * usdRate;

    let resultBlock = document.getElementById("result");
    resultBlock.style.display = "block";

    resultBlock.innerHTML = `
        💳 Метод: ${subscription ? "Подписка" : method}<br><br>
        💵 Сумма: $${amount}<br><br>
        💰 Итог: $${finalAmount.toFixed(2)}<br>
        🇷🇺 В рублях: ${rub.toFixed(0)} ₽
    `;

    tg.sendData(JSON.stringify({
        method: method,
        amount: amount,
        result: finalAmount,
        rub: rub
    }));
}
</script>

</body>
</html>
