<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
    max-width:500px;
    margin:auto;
}

h1 {
    margin-bottom:5px;
}

p {
    color:#94a3b8;
}

.methods {
    margin-top:20px;
}

.method-btn {
    width: 100%;
    padding: 18px;
    margin: 10px 0;
    border-radius: 16px;
    border: none;

    font-size: 17px;
    font-weight: 600;

    background: #e5e7eb;
    color: black;

    transition: all 0.2s ease;
}

.method-btn:active {
    transform: scale(0.97);
}

.method-btn.active {
    background: #22c55e;
    color: black;
}

input {
    width: 100%;
    padding: 18px;
    border-radius: 16px;
    border: none;
    font-size: 18px;
    margin-top: 15px;
}

.calc-btn {
    width: 100%;
    padding: 18px;
    margin-top: 20px;

    border-radius: 16px;
    border: none;

    font-size: 18px;
    font-weight: bold;

    background: #3b82f6;
    color: white;

    transition: all 0.2s ease;
}

.calc-btn:active {
    transform: scale(0.97);
}

.result {
    margin-top:20px;
    background:#1e293b;
    padding:15px;
    border-radius:16px;
}
</style>
</head>

<body>

<h1>Ondawave Exchanger</h1>
<p>Commission Calculator</p>

<div class="methods">

<button class="method-btn" onclick="selectMethod('PayPal', false, event)">PayPal</button>
<button class="method-btn" onclick="selectMethod('CashApp', false, event)">CashApp</button>
<button class="method-btn" onclick="selectMethod('Apple Cash', false, event)">Apple Cash</button>
<button class="method-btn" onclick="selectMethod('Venmo', false, event)">Venmo</button>
<button class="method-btn" onclick="selectMethod('Zelle', false, event)">Zelle</button>
<button class="method-btn" onclick="selectMethod('PayPal Invoices', false, event)">PayPal Invoices</button>

<button class="method-btn" onclick="selectMethod('Subscriptions', true, event)">
Оплата зарубежных подписок онлайн сервисов
</button>

<input id="amount" placeholder="Введите сумму $" type="number">

<button class="calc-btn" onclick="calculate()">Рассчитать</button>

<div id="result" class="result" style="display:none;"></div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let selectedMethod = null;
let usdRate = 92;
let isSubscription = false;

async function getRate() {
    try {
        let res = await fetch("https://www.cbr-xml-daily.ru/daily_json.js");
        let data = await res.json();
        usdRate = data.Valute.USD.Value;
    } catch {
        console.log("fallback rate used");
    }
}
getRate();

function selectMethod(method, subscription=false, e) {
    selectedMethod = method;
    isSubscription = subscription;

    document.querySelectorAll(".method-btn").forEach(btn => {
        btn.classList.remove("active");
    });

    e.target.classList.add("active");
}

function calculate() {
    let amount = parseFloat(document.getElementById("amount").value);

    if (!amount || amount <= 0) {
        alert("Введите сумму");
        return;
    }

    if (!selectedMethod) {
        alert("Выберите метод оплаты");
        return;
    }

    let commission = 0;
    let receive = 0;

    if (isSubscription) {
        commission = 5;
        receive = amount + commission;
    } else {
        commission = amount * 0.15;
        receive = amount - commission;
    }

    let rubAmount = receive * usdRate;

    let resultBlock = document.getElementById("result");

    resultBlock.style.display = "block";
    resultBlock.innerHTML = `
        💳 Метод: ${selectedMethod}<br><br>
        💵 Сумма: $${amount}<br><br>

        ${isSubscription 
            ? `💰 Итог к оплате: $${receive.toFixed(2)}`
            : `📊 Комиссия (15%): $${commission.toFixed(2)}<br><br>
               💰 Вы получите: $${receive.toFixed(2)}`
        }

        <br><br>
        💎 В RUB: ${rubAmount.toFixed(0)} ₽
    `;

    tg.sendData(JSON.stringify({
        method: selectedMethod,
        amount: amount,
        result: receive,
        rub: rubAmount,
        type: isSubscription ? "subscription" : "exchange"
    }));
}
</script>

</body>
</html>
