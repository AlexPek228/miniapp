<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

h1 {
    margin-bottom:5px;
}

p {
    color:#94a3b8;
}

input {
    width:80%;
    padding:15px;
    border-radius:10px;
    border:none;
    margin:20px 0;
    font-size:16px;
}

button {
    width:80%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-size:16px;
    font-weight:bold;
}

.result {
    margin-top:20px;
    background:#1e293b;
    padding:15px;
    border-radius:10px;
}
</style>
</head>

<body>

<h1>Ondawave Exchanger</h1>
<p>Commission Calculator</p>

<input id="amount" placeholder="Enter amount $" type="number">

<button onclick="calculate()">Calculate</button>

<div id="result" class="result" style="display:none;"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// фиксированный курс (можно менять)
let usdRate = 92; 

async function getRate() {
    try {
        let res = await fetch("https://www.cbr-xml-daily.ru/daily_json.js");
        let data = await res.json();
        usdRate = data.Valute.USD.Value;
    } catch (e) {
        console.log("Ошибка получения курса, используем запасной:", usdRate);
    }
}

getRate();

function calculate(){
    let amount = document.getElementById("amount").value;

    if(!amount || amount <= 0){
        alert("Enter valid amount");
        return;
    }

    let commission = amount * 0.15;
    let receive = amount - commission;

    // RUB расчеты
    let rubAmount = amount * usdRate;
    let rubReceive = receive * usdRate;

    let resultBlock = document.getElementById("result");

    resultBlock.style.display = "block";
    resultBlock.innerHTML = `
        💵 Amount: $${amount}<br>
        🇷🇺 RUB: ${rubAmount.toFixed(0)} ₽<br><br>

        📊 Commission (15%): $${commission.toFixed(2)}<br><br>

        💰 You receive: $${receive.toFixed(2)}<br>
        💎 In RUB: ${rubReceive.toFixed(0)} ₽
    `;

    // отправка в бота
    tg.sendData(JSON.stringify({
        type: "calculator",
        amount: amount,
        receive: receive,
        rub: rubReceive
    }));
}
</script>

</body>
</html>
