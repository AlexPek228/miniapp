<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    background:#f5f5f5;
    font-family:Arial;
    margin:0;
    padding:20px;
}

.container {
    max-width:500px;
    margin:auto;
}

h1 {
    text-align:center;
    margin-bottom:5px;
}

p {
    text-align:center;
    color:gray;
    margin-bottom:20px;
}

.card {
    background:white;
    padding:20px;
    border-radius:20px;
}

.methods {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.btn {
    padding:18px;
    border-radius:15px;
    border:2px solid #ddd;
    font-size:16px;
    background:white;
}

.btn.active {
    background:#1976d2;
    color:white;
    border:none;
}

.big-btn {
    width:100%;
    padding:18px;
    margin-top:10px;
    border-radius:15px;
    font-size:16px;
    background:#1976d2;
    color:white;
    border:none;
}

input {
    width:100%;
    padding:18px;
    margin-top:15px;
    border-radius:15px;
    border:2px solid #ddd;
    font-size:18px;
}

.result {
    margin-top:20px;
    padding:15px;
    border-radius:15px;
    background:#e8f5e9;
    font-size:16px;
}
</style>
</head>

<body>

<div class="container">

<h1>💱 Ondawave Exchanger</h1>
<p>Рассчитайте комиссию</p>

<div class="card">

<h3>Метод оплаты</h3>

<div class="methods">
    <button class="method-btn" onclick="selectMethod('PayPal')">PayPal</button>
<button class="method-btn" onclick="selectMethod('CashApp')">CashApp</button>
<button class="method-btn" onclick="selectMethod('Apple Cash')">Apple Cash</button>
<button class="method-btn" onclick="selectMethod('Venmo')">Venmo</button>
<button class="method-btn" onclick="selectMethod('Zelle')">Zelle</button>
<button class="method-btn" onclick="selectMethod('PayPal Invoices')">PayPal Invoices</button>

<button class="method-btn" onclick="selectMethod('Subscriptions', true)">
Оплата зарубежных подписок онлайн сервисов
</button>
</div>

<button class="big-btn" onclick="subscriptionMode()">
💳 Оплата зарубежных подписок онлайн сервисов
</button>

<h3>Введите сумму ($)</h3>

<input id="amount" type="number" placeholder="0.00">

<button class="big-btn" onclick="calculate()">
Рассчитать чистую сумму
</button>

<div id="result" class="result" style="display:none;"></div>

</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let selectedMethod = null;
let usdRate = 92;
let isSubscription = false;

// получаем курс
async function getRate() {
    try {
        let res = await fetch("https://www.cbr-xml-daily.ru/daily_json.js");
        let data = await res.json();
        usdRate = data.Valute.USD.Value;
    } catch {
        console.log("fallback rate used");
    }
}
getRate();

// выбор метода
function selectMethod(method, subscription=false) {
    selectedMethod = method;
    isSubscription = subscription;

    document.querySelectorAll(".method-btn").forEach(btn => {
        btn.style.background = "#e5e7eb";
        btn.style.color = "black";
    });

    event.target.style.background = "#22c55e";
    event.target.style.color = "black";
}

// расчет
function calculate() {
    let amount = parseFloat(document.getElementById("amount").value);

    if (!amount || amount <= 0) {
        alert("Введите сумму");
        return;
    }

    if (!selectedMethod) {
        alert("Выберите метод оплаты");
        return;
    }

    let commission = 0;
    let receive = 0;

    if (isSubscription) {
        // 🔥 логика подписок
        commission = 5;
        receive = amount + commission;
    } else {
        // обычная комиссия 15%
        commission = amount * 0.15;
        receive = amount - commission;
    }

    let rubAmount = receive * usdRate;

    let resultBlock = document.getElementById("result");

    resultBlock.style.display = "block";
    resultBlock.innerHTML = `
        💳 Метод: ${selectedMethod}<br><br>
        💵 Сумма: $${amount}<br><br>

        ${isSubscription 
            ? `💰 Итог к оплате: $${receive.toFixed(2)}`
            : `📊 Комиссия (15%): $${commission.toFixed(2)}<br><br>
               💰 Вы получите: $${receive.toFixed(2)}`
        }

        <br><br>
        💎 В RUB: ${rubAmount.toFixed(0)} ₽
    `;

    // отправка в бота
    tg.sendData(JSON.stringify({
        method: selectedMethod,
        amount: amount,
        result: receive,
        type: isSubscription ? "subscription" : "exchange"
    }));
}
</script>

</body>
</html>
